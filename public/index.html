<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Bioptica</title>
</head>
<body>
  <script>
    const tokenOptometra = localStorage.getItem('bioptica_token');
    const tokenSuperadmin = localStorage.getItem('bioptica_superadmin_token');
    if (tokenOptometra) {
      window.location.href = '/dashboard.html';
    } else if (tokenSuperadmin) {
      window.location.href = '/superadmin.html';
    } else {
      window.location.href = '/login.html';
    }
  </script>
</body>
</html>
