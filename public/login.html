<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bioptica - Iniciar sesión</title>
  <link rel="stylesheet" href="/css/estilos.css" />
  <style>
    .pantalla-login {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--azul-oscuro), var(--azul));
      padding: 1.5rem;
    }
    .tarjeta-login {
      width: 100%;
      max-width: 400px;
      background: white;
      border-radius: 18px;
      padding: 2.25rem 2rem;
      box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.35);
    }
    .logo-login {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      justify-content: center;
      margin-bottom: 0.25rem;
    }
    .logo-login span {
      font-family: Georgia, serif;
      font-weight: 700;
      font-size: 1.5rem;
      color: var(--azul-oscuro);
    }
    .subtitulo-login {
      text-align: center;
      color: #6b7280;
      font-size: 0.9rem;
      margin: 0 0 1.5rem;
    }
    .boton-login {
      width: 100%;
      padding: 0.75rem;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 10px;
    }
    .nota-login {
      text-align: center;
      font-size: 0.78rem;
      color: #9ca3af;
      margin-top: 1.25rem;
    }
  </style>
</head>
<body>
  <div class="pantalla-login">
    <form id="form-login" class="tarjeta-login">
      <div class="logo-login">
        <svg viewBox="-12 0 76 36" width="34" height="16">
          <path d="M6,18 C13,4 40,3 51,11 L61,18 L51,25 C40,33 13,32 6,18 Z" fill="none" stroke="#1e3a8a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"></path>
          <circle cx="27" cy="18" r="8.5" fill="none" stroke="#2563eb" stroke-width="2"></circle>
          <circle cx="27" cy="18" r="6" fill="#1e3a8a"></circle>
        </svg>
        <span>Bioptica</span>
      </div>
      <p class="subtitulo-login">Historia clínica de optometría con IA</p>

      <label for="email">Correo</label>
      <input type="email" id="email" required autocomplete="username" autofocus />

      <label for="password">Contraseña</label>
      <input type="password" id="password" required autocomplete="current-password" />

      <button type="submit" class="boton-login">Iniciar sesión</button>
      <p id="mensaje-error" class="mensaje-error" hidden></p>

      <p class="nota-login">Acceso para optómetras, personal administrativo y superadministradores de Bioptica.</p>
    </form>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
