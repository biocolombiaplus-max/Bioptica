<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bioptica - Iniciar sesión</title>
  <link rel="stylesheet" href="/css/estilos.css" />
</head>
<body class="pantalla-centrada">
  <form id="form-login" class="tarjeta tarjeta-angosta">
    <h1>Bioptica</h1>
    <p class="subtitulo">Historia clínica de optometría</p>

    <label for="opticaSlug">Código de la óptica</label>
    <input type="text" id="opticaSlug" required autocomplete="organization" />

    <label for="email">Correo</label>
    <input type="email" id="email" required autocomplete="username" />

    <label for="password">Contraseña</label>
    <input type="password" id="password" required autocomplete="current-password" />

    <button type="submit">Ingresar</button>
    <p id="mensaje-error" class="mensaje-error" hidden></p>
  </form>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
